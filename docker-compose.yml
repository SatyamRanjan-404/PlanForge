version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./src/backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/orchestrator
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_BASE=https://api.groq.com/openai/v1
    depends_on:
      - mongodb
      - redis

  worker:
    build:
      context: ./src/backend
    command: npm run worker
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/orchestrator
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_BASE=https://api.groq.com/openai/v1
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./src/frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mongodb_data:
  redis_data:
